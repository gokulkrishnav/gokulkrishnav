<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="326" viewBox="0 0 1000 326" role="img" aria-labelledby="gk-mig-t">
<title id="gk-mig-t">AWS to GCP migration with zero data loss: Amazon S3 (100+ buckets, largest 800+ TB) to Cloud Storage using gsutil and rsync with daily delta sync and scripted recovery; CloudFront to Cloud CDN verified with an inventory sheet and cache-hit tests; Auto Scaling Groups to Managed Instance Groups using a custom VM image and Docker images from Artifact Registry.</title>
