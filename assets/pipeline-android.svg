<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="gk-and-t">
<title id="gk-and-t">Android release pipeline with Jenkins and Fastlane for 100+ apps: Git commit with per-app config, build in Docker with Gradle, a test stage where testers run their scripts, signing with a per-app keystore, deploy with Fastlane to Google Play internal, alpha, beta and production tracks. Runs on Compute Engine with artifacts in Cloud Storage and images in Artifact Registry.</title>
