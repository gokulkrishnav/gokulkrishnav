<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="gk-gke-t">
<title id="gk-gke-t">Platform CI/CD on GKE: git push or tag, Cloud Build with checks, scanning and SHA image cache, Artifact Registry, Cloud Deploy; dev and staging deploy automatically, production after a manual approval gate with rollback. Also Secret Manager synced to Kubernetes secrets, Terraform for GKE infrastructure, preview environments with cleanup, and a deploy lock on Cloud Storage. 8-10 releases a week.</title>
